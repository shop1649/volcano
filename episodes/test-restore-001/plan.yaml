# 보고 들은 방법(에이전트): 프레임만 봤다 — 0.5s 간격 접촉 시트(v_hall 0~20s 전체, v_room 0~49s 1s 간격 + 27.5~35.5s 0.5s 간격)와
#   0.25s 간격 얼굴 검출(`clean faces --sample-fps 4`). 소리는 듣지 못했다: 오디오는 기계 측정만 했다
#   (v_hall: volumedetect mean -21.7 dB / max -3.7 dB, -20.3 LUFS, 0.5s RMS 가 전 구간 약 -21.7 dB(음악)이고
#    8.0~10.5s 만 -19.2~-20.8 dB 로 올라감(말소리); v_room: 무음 -91.0 dB).
# 본 장면(원본 시각):
#   v_hall  0.0~3.3s 빈 복도 / 3.4s 복도 끝 유리문 쪽에 남성이 처음 보임 → 3.5~8.2s 카메라 쪽으로 걸어옴 →
#           8.3~18.2s 카메라 바로 앞에서 정면을 보고 가만히 서 있음 → 18.3~19.4s 오른쪽으로 빠르게 걸어 화면 밖 → 19.5s 빈 복도
#   v_room  28.0s 아래쪽에서 머리가 보이기 시작 → 28.5~30.5s 세 사람(회색 셔츠 남성·검은 옷 여성·흰 셔츠에 모자 쓴 사람)이 들어와
#           걸어감 → 31.0s 회색 셔츠 남성은 왼쪽, 나머지 둘은 오른쪽으로 갈라짐 → 33.0s 왼쪽 남성 화면 밖 → 34.5s 모두 화면 밖
