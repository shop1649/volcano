# 파이프라인 검증용 테스트 에피소드 (mode: test — 게시용 아님, 승인 불필요)
# 소재: Intel sample-videos (CC BY 4.0) 두 개. classroom_voice.mp4 는 무음 classroom.mp4 에
#       espeak-ng 한국어 TTS 한 줄(speech_02.wav)을 19.6s 에 얹은 합성 소스다
#       (`python -m shortkit episode test-source` 로 재생성, sha256 은 같은 ffmpeg 에서 재현됨).
# 자막·효과음 사건 시각은 프레임을 직접 보고 정했다(0.5s/0.17s 간격 접촉 시트):
#   classroom  2.8s 창가 남성이 일어서기 시작 → 4.5s 선 자세 / 15.5~16.5s 다시 앉음 /
#              17.17~17.33s 뒷줄 남성이 손을 듦 / 20.0~21.0s 뒷줄 남성이 일어섬
#   head-pose  5.0~5.5s 두 사람이 고개를 옆으로 기울임(10.5s 까지 유지) → 10.5~11.0s 고개를 다시 바로 함
#   s4 는 마지막 자막(c_sit4, 19.0s = 원본 9.25s) 뒤 motion.trim.tail_after_meaning_s(0.25s)까지만 쓴다(원본 9.5s):
#   그 뒤(원본 9.5~11.5s)는 기울인 채 가만히 있다가 고개를 바로 하는 꼬리로, 자막·사건이 없는 의미 끝난 구간이라 잘랐다.
