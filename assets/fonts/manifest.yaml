# Candidate fonts for caption rendering and reference font identification.
#
# - `fonts`: files fetched by `shortkit doctor --fetch-fonts` (shortkit.fonts.fetch_all) into assets/fonts/
#   (binaries are git-ignored; the URL + sha256 here are the canonical source).  A file whose sha256 does not
#   match is never used.
# - `name` is family + weight exactly as fontconfig / FreeType report it ("Regular" is dropped), and is what
#   presets use in text.roles.<role>.font_name.  shortkit.fonts.find_font() accepts only an exact face match
#   (fontconfig rules: case and blanks ignored); there is no fallback.
# - `system`: faces expected from OS packages (found through fontconfig, not pinned by hash because the file
#   differs per OS/package version).
# - status `not_acquired`: fonts popular in Korean shorts that could NOT be obtained/pinned on the build machine.
#   Only the name is recorded: no URL or hash is invented.  If the reference turns out to use one of them,
#   identification against the acquired candidates can only return `similar`/`different`, never `identical`.
schema: shortkit.fonts_manifest/1
dir: assets/fonts
