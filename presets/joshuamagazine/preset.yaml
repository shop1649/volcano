# ---------------------------------------------------------------------------------------------
# Preset: joshuamagazine-v1  (레퍼런스: https://youtube.com/@joshuamagazine)
#
# !!! 상태: 모든 스타일 값은 PROVISIONAL(임시 기본값) 이다. !!!
#   2026-09-24 분석 시점에 이 작업 환경의 네트워크 정책이 youtube.com / googlevideo.com /
#   i.ytimg.com 을 차단(HTTP 403)해서 레퍼런스 영상을 한 편도 받지 못했다. 따라서 아래 값 중
#   어떤 것도 레퍼런스에서 측정된 값이 아니다. 각 키의 상태·근거·영향은
#   settings_registry.yaml 에 기록되어 있고, `shortkit preset audit` 이 미측정 키가 남아 있는 한
#   production 렌더와 QA 최종 관문을 통과시키지 않는다(테스트 모드만 허용).
#   측정 후 `shortkit preset apply-measurements` 가 measurements/*.json 의 값을 measured.yaml 층에 쓴다(이 파일은
#   바뀌지 않는다 — 유효 값은 preset.yaml ← measured.yaml ← requested_changes.yaml, `shortkit preset show`).
#
# 규칙
#   - 좌표·크기는 canvas 해상도(canvas.width x canvas.height) 기준 픽셀. 이 파일의 임시값은 1080x1920 기준.
#     측정값은 apply-measurements 가 측정 파일의 해상도(scaled_to/resolution)에서 유효 캔버스로 환산해
#     measured.yaml 에 canvas_resolution 과 함께 쓴다(종횡비가 다르면 반영하지 않음).
#   - 경로는 프로젝트 루트 기준 상대 경로.
#   - 여기 있는 값은 "고정 스타일". 새 소재마다 다시 판단하는 좌표·시각은 에피소드 plan.yaml 에 둔다
#     (per_episode 섹션은 무엇을 매번 다시 판단하는지의 목록일 뿐 값이 아니다).
#   - 원 채널의 채널명·로고·워터마크 등 고유 식별 요소는 복제하지 않는다(identity_exclusions).
# ---------------------------------------------------------------------------------------------
preset_id: joshuamagazine-v1
schema: shortkit.preset/1
reference:
  platform: youtube
  channel_handle: '@joshuamagazine'
  channel_url: https://youtube.com/@joshuamagazine
  channel_id_hint: UC_TL4XPdPb0WnAudbMMS2_g   # WebSearch 결과 링크에서 얻음. 직접 접속 확인 못 함(미검증)
  snapshot_file: presets/joshuamagazine/reference/latest100.json
  latest_n: 100
  high_view_threshold: 800000
  sfx_catalog_latest_n: 50
identity_exclusions:
  # 최종 화면·오디오에 나오면 안 되는 원 채널 식별 요소. QA 가 OCR 로 검사한다.
  forbidden_text: ['조슈아매거진', '조슈아 매거진', 'joshuamagazine', 'joshua magazine', 'JOSHUA MAGAZINE']
  logo_templates_dir: presets/joshuamagazine/reference/identity_templates   # 레퍼런스에서 추출(미측정)
  own_branding: none      # 규칙(측정 대상 아님): 우리 채널 브랜딩은 이 프리셋에서 넣지 않는다(요청 시 requested_changes 로).
                          #   none 이면 episode validate(check_own_branding)가 제목·설명·상황·반응 자막의 @핸들/주소 형태 문구를
                          #   오류로 막는다(화면 속 글자를 옮긴 자막 grounding.kind=on_screen_text 는 예외)

canvas:
  width: 1080
  height: 1920
  fps: 30
  background:
    type: color            # color | blur_source
    color: '#000000'
    blur_sigma: 30
  video_region:            # 소스 영상이 놓이는 영역
    x: 0
    y: 656
    w: 1080
    h: 608
    fit: cover             # cover(잘라서 채움) | contain(여백)
  safe_margin: {left: 54, right: 54, top: 110, bottom: 250}

text:
  font_dirs: [assets/fonts]
  roles:
    title:                 # 제목(상단 고정 헤드라인)
      font_name: Noto Sans CJK KR Black
      font_file: null      # null 이면 시스템/assets/fonts 에서 font_name 으로 찾는다
      bold: true
      size_px: 84
      color: '#FFFFFF'
      highlight_color: '#FFE400'
      outline_px: 6
      outline_color: '#000000'
      shadow_px: 0
      shadow_color: '#000000'
      box: {enabled: false, color: '#000000', alpha: 0.0, pad_x: 18, pad_y: 10}
      line_spacing: 1.18
      max_width_px: 980
      max_lines: 2
      max_chars_per_line: 13
      anchor: {x: 540, y: 330, align: center, valign: middle}
      motion_in: {type: none, dur_s: 0.0, scale_from: 1.0, offset_px: 0}
      motion_out: {type: none, dur_s: 0.0}
      timing: {lead_s: 0.0, min_dur_s: 1.0}
      persist: whole_video   # whole_video | timed
    description:           # 제목 아래 설명
      font_name: Noto Sans CJK KR Bold
      font_file: null
      bold: true
      size_px: 46
      color: '#E6E6E6'
      highlight_color: '#FFE400'
      outline_px: 4
      outline_color: '#000000'
      shadow_px: 0
      shadow_color: '#000000'
      box: {enabled: false, color: '#000000', alpha: 0.0, pad_x: 14, pad_y: 8}
      line_spacing: 1.15
      max_width_px: 980
      max_lines: 1
      max_chars_per_line: 20
      anchor: {x: 540, y: 500, align: center, valign: middle}
      motion_in: {type: fade, dur_s: 0.2, scale_from: 1.0, offset_px: 0}
      motion_out: {type: none, dur_s: 0.0}
      timing: {lead_s: 0.0, min_dur_s: 1.0}
      persist: timed
    situation:             # 본문 자막: 상황 설명
      font_name: Noto Sans CJK KR Black
      font_file: null
      bold: true
      size_px: 66
      color: '#FFFFFF'
      highlight_color: '#FFE400'
      outline_px: 6
      outline_color: '#000000'
      shadow_px: 0
      shadow_color: '#000000'
      box: {enabled: false, color: '#000000', alpha: 0.0, pad_x: 16, pad_y: 8}
      line_spacing: 1.15
      max_width_px: 960
      max_lines: 2
      max_chars_per_line: 14
      anchor: {x: 540, y: 1430, align: center, valign: middle}
      motion_in: {type: pop, dur_s: 0.12, scale_from: 0.85, offset_px: 0}
      motion_out: {type: none, dur_s: 0.0}
      timing: {lead_s: 0.0, min_dur_s: 0.9}
      persist: timed
    speaker:               # 인물 식별 라벨
      font_name: Noto Sans CJK KR Bold
      font_file: null
      bold: true
      size_px: 40
      color: '#FFFFFF'
      highlight_color: '#FFE400'
      outline_px: 0
      outline_color: '#000000'
      shadow_px: 0
      shadow_color: '#000000'
      box: {enabled: true, color: '#000000', alpha: 0.65, pad_x: 14, pad_y: 6}
      line_spacing: 1.1
      max_width_px: 420
      max_lines: 1
      max_chars_per_line: 10
      anchor: {x: 540, y: 700, align: center, valign: middle}   # 기본값; 실제 위치는 에피소드별(인물 옆)
      motion_in: {type: fade, dur_s: 0.15, scale_from: 1.0, offset_px: 0}
      motion_out: {type: fade, dur_s: 0.15}
      timing: {lead_s: 0.0, min_dur_s: 1.0}
      persist: timed
    dialogue:              # 실제 대사(원음 인용)
      font_name: Noto Sans CJK KR Black
      font_file: null
      bold: true
      size_px: 62
      color: '#FFE400'
      highlight_color: '#FFFFFF'
      outline_px: 6
      outline_color: '#000000'
      shadow_px: 0
      shadow_color: '#000000'
      box: {enabled: false, color: '#000000', alpha: 0.0, pad_x: 16, pad_y: 8}
      line_spacing: 1.15
      max_width_px: 960
      max_lines: 2
      max_chars_per_line: 15
      anchor: {x: 540, y: 1430, align: center, valign: middle}
      motion_in: {type: none, dur_s: 0.0, scale_from: 1.0, offset_px: 0}
      motion_out: {type: none, dur_s: 0.0}
      timing: {lead_s: 0.0, min_dur_s: 0.8}
      quote_marks: ['"', '"']
      persist: timed
    reaction:              # 반응·효과자막
      font_name: Noto Sans CJK KR Black
      font_file: null
      bold: true
      size_px: 76
      color: '#FFE400'
      highlight_color: '#FFFFFF'
      outline_px: 7
      outline_color: '#000000'
      shadow_px: 0
      shadow_color: '#000000'
      box: {enabled: false, color: '#000000', alpha: 0.0, pad_x: 16, pad_y: 8}
      line_spacing: 1.1
      max_width_px: 900
      max_lines: 1
      max_chars_per_line: 10
      anchor: {x: 540, y: 1140, align: center, valign: middle}
      motion_in: {type: pop, dur_s: 0.1, scale_from: 1.35, offset_px: 0}
      motion_out: {type: none, dur_s: 0.0}
      timing: {lead_s: 0.0, min_dur_s: 0.6}
      persist: timed
  tone:                    # 자막 말투(측정 전 임시). ref aggregate 가 레퍼런스 자막 OCR 종결 어미로 측정
    register: 반말_구어체    # 반말_구어체 | 해요체 | 음슴체 | 합쇼체 | 혼합 — episode validate(check_tone)가 제목·설명·상황·반응
                           #   자막의 문장 끝을 같은 분류기로 검사(대사 dialogue 예외; production 오류 / test 경고)
    sentence_end_examples: []   # 레퍼런스 종결 어미 빈도 상위 — 첫 편 제안서(proposal.md)의 '말투 안내'로 대본 작성자에게 제시
    emoji: false           # false 면 위 역할 자막의 이모지를 validate 가 막음
    notes: 측정 전. 레퍼런스 자막 OCR 로 종결어미 분포를 측정해 채운다.   # 분류: meta(기록용 메모, 제작 값 아님)

motion:
  zoom:
    scale_to: 1.25
    dur_s: 0.35
    ease: out
    max_consecutive: 1     # 임시값(못 잼): 연속 세그먼트에서 줌 최대 횟수 — ref aggregate 가 영상별 최장 연속 확대 샷 수의
                           #   p90 으로 측정(visual_motion.json). 규칙이 아니라 레퍼런스 스타일 값
    recenter: false        # 임시값(못 잼): false = 확대 중심(zoom.center)이 화면에서 제자리(현재 렌더러 동작),
                           #   true = 확대하면서 중심을 영상 영역 가운데로 옮김(cover 면 빈 곳이 안 보이게 제한)
  freeze:
    hold_s: 0.7
    max_per_video: 2       # 임시값(못 잼): 편당 정지 최대 횟수 — ref aggregate 가 영상별 정지 횟수의 p90 으로 측정
                           #   (visual_motion.json, 전체·포맷별). 요청문에 이런 규칙은 없음: 레퍼런스 관측 범위로만 정함
  transitions:
    default: cut           # cut | flash | crossfade
    flash: {dur_s: 0.12, color: '#FFFFFF', scope: region}   # scope 임시값(못 잼): region = 영상 영역만(현재 동작) | canvas = 화면 전체
    crossfade: {dur_s: 0.25}
  speed:
    slowmo_factor: 0.5
  trim:
    tail_after_meaning_s: 0.25   # 규칙: 의미가 끝난 뒤 남기는 꼬리 최대치 — episode validate(check_trim_tail)가 세그먼트의 마지막
                                 #   의미 표지(근거 있는 자막·효과음 사건·살린 원음·정지·확대·장식) 뒤 꼬리를 경고(reaction/outro 예외)

decorations:
  # arrow 모양 비율(임시값, 못 잼 — 지금까지 렌더러에 박혀 있던 값): 머리 길이/전체 길이, 머리 폭/전체 길이, 몸통 폭/전체 길이
  arrow: {color: '#FF2A2A', size_px: 120, outline_px: 6, outline_color: '#FFFFFF', blink_hz: 0.0,
          head_len_ratio: 0.45, head_width_ratio: 0.62, shaft_width_ratio: 0.24}
  # circle/box: 원·네모 테두리(안쪽이 비어 있음 — 보호 영역을 둘러싸는 것은 가림이 아님). resolve 가 plan 에서 쓸 때 읽는다
  # (episodes/test-coverage-001 이 둘 다 씀)
  circle: {color: '#FF2A2A', stroke_px: 10, blink_hz: 0.0}
  box: {color: '#FF2A2A', stroke_px: 8, blink_hz: 0.0}

render:
  clean:
    blur_sigma_ratio: 0.166667   # 분류: 규칙(우리 원본 정리 단계의 렌더 파라미터, 레퍼런스 스타일 아님 — 지금까지의 렌더러 동작 1/6):
                                 #   sources[].clean.blur 가우시안 sigma = max(w, h) × 이 값 (원본 px)

audio:
  sample_rate: 48000
  # 레벨 규칙: 아래 gain_db 값(bgm.gain_db, sfx.gain_db_default, plan 의 sfx gain_db)은 모두
  # "최종 프로그램 음량(integrated_lufs)에서의 레벨"이다(깨끗한 음원/효과음 파일 대비 dB). `ref audio-measure` 가
  # audio.bgm.gain_db 를 그렇게 잰다(깨끗한 음원 LS 이득 + 목표 LUFS - 레퍼런스 믹스 LUFS). 그래서 마지막 음량 정규화는 작은
  # (original.keep_gain_db 는 단위가 다르다: 원본 소리 대비 dB 가 아니라 프로그램 음량 대비 LU — 아래 original 참고.)
  # 보정이어야 한다. BGM 에는 어떤 리미터도 걸지 않는다. 전경(효과음+살린 원음)만 max_limiter_db 까지 줄일 수 있고, 그보다
  # 더 필요하면 전체 이득을 낮추고 목표 음량 부족분을 render_report.json 에 적는다(test 경고 / production 오류).
  loudness: {integrated_lufs: -14.0, true_peak_db: -1.5, tolerance_lu: 1.0,
             max_limiter_db: 3.0}   # max_limiter_db: 규칙(측정값 아님) — QA 효과음 레벨 허용(±3 dB) 안에 머물도록
  bgm:
    track_id: null         # 곡 식별 전(못 잼). assets/library/music 의 깨끗한 파일 id
    title: null            # 곡 식별 = 제목 AND 버전: resolve(audio.check_bgm_identity)가 음악 라이브러리 항목의 title/version 과
    version: null          #   비교(다른 버전 = 다른 트랙 → 오류). original | sped_up | slowed | remix | instrumental ...
    tempo_ratio: 1.0       # 원곡 대비 속도
    section_start_s: 0.0   # 원곡에서 실제 사용 시작 지점(plan.bgm.section_start_s 가 없으면 이 값; 덮어쓰면 경고 — 다른 구간은 불일치)
    gain_db: 0.0           # 임시값(못 잼). 최종 프로그램 음량에서의 BGM 레벨(깨끗한 음원 대비 dB). 0 = 받은 파일 그대로:
                           #   테스트 음원 music_bed_a.wav(-14.4 LUFS, -1.9 dBTP)가 BGM 만 나올 때 목표 -14 LUFS 근처에 놓임
    fade_in_s: 0.0
    fade_out_s: 0.8
    loop: false
    loop_xfade_s: 0.05  # 규칙(측정 대상 아님): loop=true 일 때 되감기 지점 등전력 크로스페이드 길이
  original:
    default: off           # 원본 소리는 기본 OFF. 중요 대사/말하는 구간만 plan 에서 keep
    keep_gain_db: 0.0      # 임시값(못 잼). 살린 원음(대사)의 음량 = 프로그램 음량 대비 LU(살린 구간 integrated LUFS
                           #   − 믹스 integrated LUFS, `ref audio-measure` 가 이 단위로 잼). 렌더러 이득 = T + keep_gain_db − L_src
                           #   (T = loudness.integrated_lufs, L_src = 그 클립에서 살린 원본 소리의 실측 integrated LUFS).
                           #   plan 의 timeline[].original_audio.gain_db 도 같은 단위. 원본 소리 대비 dB 가 아님.
    fade_s: 0.04
    remove_embedded_music: true   # 원본에 붙은 음악은 분리(demucs vocals)해서 제거
  ducking:
    depth_db: 10.0         # 보존한 대사 구간에서만 BGM 을 낮춤
    attack_s: 0.08
    release_s: 0.3
    only_under_kept_dialogue: true
  sfx:
    catalog: presets/joshuamagazine/sfx_catalog.json
    map: presets/joshuamagazine/sfx_map.yaml
    gain_db_default: -8.0  # 임시값(못 잼). 최종 프로그램 음량에서 효과음 레벨(효과음 파일 대비 dB): 0 dBFS 근처로 만든
                           #   파일(테스트 효과음 최대 +3.3 dBTP)도 봉우리가 true-peak 한도(-1.5 dBTP) 아래
    max_event_offset_s: 0.3
    require_event: true
  silence:
    fade_s: 0.05

structure:
  formats_file: presets/joshuamagazine/formats.yaml
  duration_s: {p10: null, p50: null, p90: null, n: 0}   # episode validate(check_structure): 계획 길이가 p10..p90 밖이면
                                                        #   production 오류 / test 경고, 미측정이면 경고
  cuts_per_10s: {p10: null, p50: null, p90: null, n: 0}   # 컷 빈도(10초당 컷 수). 레퍼런스 측정 전 못 잼
  shot_len_s: {p10: null, p50: null, p90: null, n: 0}     # 샷 길이 분포(초). 레퍼런스 측정 전 못 잼
  first_caption_at_s: 0.0

presence:                  # 채널 단위 있다/없다/못 잼 (ref aggregate / audio-measure 의 visual_presence·audio 측정). 측정 전 unmeasured
  zoom: unmeasured          # present | absent | unmeasured
  freeze: unmeasured
  speed_change: unmeasured
  flash: unmeasured
  crossfade: unmeasured
  decorations: unmeasured
  bgm: unmeasured
  original_audio: unmeasured
  ducking: unmeasured
  intentional_silence: unmeasured

cover:
  source: first_frame      # first_frame | chosen_frame
  text_role: title

per_episode:               # 새 소재마다 다시 판단하는 항목(값은 plan.yaml 에)
  - timeline.segments(src_in/src_out, 순서)
  - captions(text/start/end, speaker 라벨 위치)
  - zoom.center, zoom.start
  - decorations.keyframes
  - sfx(t, type, event)
  - original_audio.keep ranges
  - bgm.section_start_s (곡이 고정이면 고정, 에피소드 길이에 맞춘 끝 처리)
  - sources[].clean(crop/delogo/inpaint)
  - sources[].protected(얼굴·손·핵심 물체)

approval:                  # 규칙: 승인 관문(plan.approval_state_for)이 회차에 맞는 키 하나를 읽는다
  first_episode_requires_approval: true    # episode_index 1(또는 회차 없음)
  later_episodes_require_approval: false   # episode_index > 1
